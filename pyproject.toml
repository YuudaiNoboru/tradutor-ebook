[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradutor-ebook"
description = "Tradutor de e-books EPUB para o portugues usando APIs de LLM (BYOK)"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dynamic = ["version"]
keywords = ["epub", "translation", "tui", "llm", "textual"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "textual",
  "lxml",
  "ebooklib",
  "httpx",
  "tiktoken",
  "keyring",
  "platformdirs",
  "cryptography",
  "pydantic",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "coverage",
  "hypothesis",
  "respx",
  "ruff",
  "commitizen",
  "pyinstaller",
  "mypy",
  "import-linter",
  "mutmut",
  "pip-audit",
  "vulture",
  "lxml-stubs",
  "pillow",
]

[project.scripts]
tradutor = "tradutor.cli:main"

[project.urls]
Repository = "https://github.com/YuudaiNoboru/tradutor-ebook"

[tool.hatch.build.targets.wheel]
packages = ["src/tradutor"]

[tool.hatch.version]
path = "src/tradutor/__init__.py"

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
cov = "coverage run -m pytest {args} && coverage report -m"
lint = "ruff check {args:.}"
fmt = "ruff format {args:.}"
fmt-check = "ruff format --check {args:.}"
typecheck = "mypy {args:src tests}"
arch-check = "lint-imports {args}"
mutate = "mutmut run {args}"
audit = "pip-audit {args}"
deadcode = "vulture {args:src}"
setup = "python -c \"import glob, os, subprocess; [os.chmod(f, 0o755) for f in glob.glob('.githooks/*')]; subprocess.run(['git', 'config', 'core.hooksPath', '.githooks'], check=True)\""
release = "cz bump"
installer = "python scripts/build_installer.py"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["tradutor"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == \"__main__\":",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.commitizen]
version = "0.7.0"
version_files = ["src/tradutor/__init__.py:__version__"]
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
changelog_incremental = true
major_version_zero = true

[tool.commitizen.change_type_map]
feat = "Funcionalidades"
fix = "Correções de bugs"
docs = "Documentação"
style = "Estilo"
refactor = "Refatoração"
perf = "Desempenho"
test = "Testes"
build = "Build"
ci = "CI"
chore = "Manutenção"
revert = "Reversões"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "ebooklib",
  "keyring.backends.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.importlinter]
root_package = "tradutor"

[[tool.importlinter.contracts]]
name = "Domain layer must not depend on outer layers"
type = "forbidden"
source_modules = ["tradutor.domain"]
forbidden_modules = [
  "tradutor.epub",
  "tradutor.translate",
  "tradutor.providers",
  "tradutor.infra",
  "tradutor.tui",
  "tradutor.cli",
]

[[tool.importlinter.contracts]]
name = "Core layers must not depend on UI or CLI"
type = "forbidden"
source_modules = [
  "tradutor.domain",
  "tradutor.epub",
  "tradutor.translate",
  "tradutor.providers",
  "tradutor.infra",
]
forbidden_modules = [
  "tradutor.tui",
  "tradutor.cli",
]

[tool.mutmut]
source_paths = [
  "src/tradutor/domain/protection.py",
  "src/tradutor/domain/quality.py",
  "src/tradutor/epub/segments.py",
  "src/tradutor/epub/index_rebuilder.py",
]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.vulture]
min_confidence = 80
paths = ["src/tradutor"]
exclude = ["tests/"]
ignore_names = [
  "action_*",
  "watch_*",
  "on_*",
  "compose",
  "check_*",
  "render",
  "get_system_commands",
]
