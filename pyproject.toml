[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradutor-ebook"
description = "Tradutor de e-books EPUB para o portugues usando APIs de LLM (BYOK)"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dynamic = ["version"]
keywords = ["epub", "translation", "tui", "llm", "textual"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "textual",
  "lxml",
  "ebooklib",
  "httpx",
  "tiktoken",
  "keyring",
  "platformdirs",
  "cryptography",
  "pydantic",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "coverage",
  "hypothesis",
  "respx",
  "ruff",
  "commitizen",
]

[project.scripts]
tradutor = "tradutor.cli:main"

[project.urls]
Repository = "https://github.com/YuudaiNoboru/tradutor-ebook"

[tool.hatch.build.targets.wheel]
packages = ["src/tradutor"]

[tool.hatch.version]
path = "src/tradutor/__init__.py"

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
cov = "coverage run -m pytest {args} && coverage report -m"
lint = "ruff check {args:.}"
fmt = "ruff format {args:.}"
fmt-check = "ruff format --check {args:.}"
setup = "git config core.hooksPath .githooks"
release = "cz bump"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["tradutor"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == \"__main__\":",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.commitizen]
version = "0.3.0"
version_files = ["src/tradutor/__init__.py:__version__"]
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
changelog_incremental = true
major_version_zero = true

[tool.commitizen.change_type_map]
feat = "Funcionalidades"
fix = "Correções de bugs"
docs = "Documentação"
style = "Estilo"
refactor = "Refatoração"
perf = "Desempenho"
test = "Testes"
build = "Build"
ci = "CI"
chore = "Manutenção"
revert = "Reversões"
